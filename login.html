<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lock For Long</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <link rel="apple-touch-icon" href="./logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body class="auth-body">
    <div class="login-page">
        <div class="login-container glass-panel">
            <div class="login-header">
                <h1>Lock For Long</h1>
                <p>Sign in to secure your digital time capsule</p>
            </div>
            
            <div id="googleLoginContainer" class="google-btn-wrapper" onclick="initiateLogin()">
                <div class="google-btn-custom">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo">
                    Sign in with Google
                </div>
                <div id="googleLoginBtnReal"></div>
            </div>

            <div class="separator">
                <span>OR</span>
            </div>

            <button id="guestLoginBtn" class="guest-btn">
                <span>👤</span> Continue as Guest
            </button>
            
            <p class="login-note">Google login may be unavailable on some mobile devices. Use Guest mode to test.</p>
        </div>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = '664114208940-kk82uu7rr9efpv0a6rm07mtv93uq3fek.apps.googleusercontent.com';

        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            const currentUser = {
                name: responsePayload.name,
                email: responsePayload.email,
                photoURL: responsePayload.picture
            };
            localStorage.setItem('lockOfLongUser', JSON.stringify(currentUser));
            window.location.href = 'index.html'; 
        }


        // Handle Login (Web or Native)
        async function initiateLogin() {
            // alert("initiateLogin() called!"); 
            if (window.Capacitor && window.Capacitor.Plugins.GoogleAuth) {
                try {
                    // alert("Starting Native Google Sign-In...");
                    const user = await window.Capacitor.Plugins.GoogleAuth.signIn();
                    // alert("Sign-In Success: " + user.email);
                    const currentUser = {
                        name: user.givenName + " " + user.familyName,
                        email: user.email,
                        photoURL: user.imageUrl
                    };
                    localStorage.setItem('lockOfLongUser', JSON.stringify(currentUser));
                    window.location.href = './index.html';
                } catch (err) {
                    console.error("Native Google Login Failed:", err);
                    alert("Login Error: " + (err.message || JSON.stringify(err)));
                }
            } else {
                alert("Plugin not found. Are you on mobile?");
            }
        }

        window.onload = function () {
            // alert("Page Loaded. Checking for Capacitor...");
            
            // Native Initialization
            if (window.Capacitor && window.Capacitor.Plugins.GoogleAuth) {
                // alert("Capacitor & GoogleAuth Plugin detected!");
                try {
                    window.Capacitor.Plugins.GoogleAuth.initialize();
                    const googleBtn = document.getElementById('googleLoginContainer');
                    if (googleBtn) {
                        googleBtn.style.opacity = '1';
                        googleBtn.style.border = '2px solid #8b5cf6'; // Highlight as enabled
                        googleBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            initiateLogin();
                        }, true); // Use capture phase
                    }
                } catch (e) {
                    alert("Init Error: " + e.message);
                }
                return;
            }

            // Web Initialization
            if (typeof google !== 'undefined') {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleCredentialResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById("googleLoginBtnReal"),
                    { theme: "outline", size: "large", width: "320" } 
                );
            } else {
                const googleBtn = document.getElementById('googleLoginContainer');
                if (googleBtn) googleBtn.style.opacity = '0.5';
            }
        };

        // Guest Login Handler
        document.getElementById('guestLoginBtn').addEventListener('click', () => {
            const guestUser = {
                name: "Guest User",
                email: "guest@example.com",
                photoURL: "https://ui-avatars.com/api/?name=Guest+User&background=8b5cf6&color=fff"
            };
            localStorage.setItem('lockOfLongUser', JSON.stringify(guestUser));
            window.location.href = './index.html';
        });

        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
